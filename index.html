<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sofia d’Ettorre — Portfolio</title>
  <meta name="description" content="Portfolio di Sofia d’Ettorre, Communication Designer: editoria, brand identity e UX/UI design con un approccio orientato alla sostenibilità.">
  <link rel="canonical" href="https://sofiadettorre.github.io/Portfolio/">
  <link rel="alternate" hreflang="it" href="https://sofiadettorre.github.io/Portfolio/?lang=it">
  <link rel="alternate" hreflang="en" href="https://sofiadettorre.github.io/Portfolio/?lang=en">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sofia d’Ettorre — Portfolio">
  <meta property="og:description" content="Communication Designer: editoria, brand identity e UX/UI design con un approccio orientato alla sostenibilità.">
  <meta property="og:url" content="https://sofiadettorre.github.io/Portfolio/">
  <meta property="og:image" content="https://sofiadettorre.github.io/Portfolio/immagini-web/immagine%20hero.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="immagini-web/favicon.svg">
  <link rel="icon" type="image/png" href="immagini-web/favicon.png">
  <link rel="apple-touch-icon" href="immagini-web/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="top">
    <a class="topbar__name" href="#top">Sofia d’Ettorre</a>
    <span class="topbar__place" id="status"></span>
    <div class="lang" role="group" id="lang" data-i18n-aria="langSwitch">
      <button type="button" data-lang="it" lang="it">IT</button>
      <span class="lang__sep" aria-hidden="true">|</span>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <section class="hero" aria-labelledby="hero-name">
    <div class="pix pix--flower" data-pixel="flower" aria-hidden="true"></div>
    <div class="pix pix--sparkle" data-pixel="sparkle" aria-hidden="true"></div>
    <div class="pix pix--sprig" data-pixel="sprig" aria-hidden="true"></div>
    <div class="pix pix--apple" data-pixel="apple" aria-hidden="true"></div>

    <div class="hero__body">
      <p class="hero__greet" id="hero-greet"></p>
      <p class="hero__text" id="hero-text"></p>
      <p class="hero__cta" id="hero-cta"></p>
      <h1 class="hero__name" id="hero-name" tabindex="0">
        <span aria-hidden="true">✿</span> Sofia d’Ettorre <span aria-hidden="true">✿</span>
        <span class="hero__photo" aria-hidden="true">
          <img id="hero-photo" alt="" decoding="async">
        </span>
      </h1>
    </div>
  </section>

  <main class="main">
    <aside class="rail">
      <div class="rail__grid">
        <div class="rail__col">
          <section class="rail__section">
            <span class="eyebrow" data-i18n="bio"></span>
            <div class="bio" id="bio"></div>
          </section>
          <section class="rail__section">
            <span class="eyebrow" data-i18n="work"></span>
            <ul class="list" id="work"></ul>
          </section>
          <section class="rail__section">
            <span class="eyebrow" data-i18n="education"></span>
            <ul class="list" id="education"></ul>
          </section>
        </div>

        <div class="rail__col">
          <section class="rail__section" id="info">
            <span class="eyebrow" data-i18n="info"></span>
            <div class="contact-list" id="contacts"></div>
          </section>
          <section class="rail__section">
            <span class="eyebrow" data-i18n="skills"></span>
            <ul class="taglist" id="skills"></ul>
          </section>
          <section class="rail__section">
            <span class="eyebrow" data-i18n="languages"></span>
            <ul class="list" id="languages"></ul>
          </section>
        </div>
      </div>
    </aside>

    <section class="projects" id="lavori" data-i18n-aria="projects"></section>
  </main>

  <footer class="footer">
    <div class="footer__bar">
      <span id="copy"></span>
      <a href="#top" data-i18n="top"></a>
    </div>
    <div class="footer__art" data-pixel="footer" aria-hidden="true"></div>
  </footer>

  <!-- Pannello del progetto -->
  <div class="cs-overlay" id="cs-overlay" aria-hidden="true">
    <div class="cs-panel" role="dialog" aria-modal="true" aria-labelledby="cs-title">
      <aside class="cs-side">
        <button class="cs-close" id="cs-close" type="button" data-i18n-aria="close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
        </button>
        <div>
          <h2 class="cs-title" id="cs-title">–</h2>
          <p class="cs-oneliner" id="cs-oneliner"></p>
        </div>
        <dl class="cs-facts" id="cs-facts"></dl>
        <div class="cs-step">
          <button type="button" id="cs-prev" data-i18n="prev" data-i18n-aria="prevAria"></button>
          <button type="button" id="cs-next" data-i18n="next" data-i18n-aria="nextAria"></button>
        </div>
      </aside>
      <div class="cs-content" id="cs-content">
        <div class="cs-hero" id="cs-hero"></div>
        <div class="cs-text">
          <div class="cs-section">
            <p class="eyebrow" data-i18n="overview"></p>
            <p id="cs-overview"></p>
          </div>
          <div class="cs-section">
            <p class="eyebrow" data-i18n="contributions"></p>
            <ol class="cs-list" id="cs-contrib"></ol>
          </div>
        </div>
        <div class="cs-gallery" id="cs-gallery"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
